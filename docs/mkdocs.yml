site_name: Airton
repo_url: https://github.com/MarcoAAlmeida/airton

docs_dir: content

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Roadmap:
      - Overview: roadmap/index.md
      - Activity 01:
          - Overview: roadmap/activity-01/index.md
          - Deep dive: roadmap/activity-01/deep_dive.md
  - Design Decisions: sdd/index.md

theme:
  name: material
  palette:
    primary: yellow
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
